- {action: click, name: sort names, x: 528, y: 80, dt: 10}
- {action: screen, name: browser_name_sort, dt: 10}
- {action: click, name: reverse names, x: 528, y: 80, dt: 10}
- {action: click, name: sort occupancy, x: 700, y: 80, dt: 10}
- {action: click, name: sort mode, x: 825, y: 80, dt: 10}
